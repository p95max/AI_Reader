[project]
name = "ai-reader"
version = "0.1.0"
description = "Backend API for AI Reader"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14.0",
    "boto3>=1.35.0",
    "celery[redis]>=5.4.0",
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "openai>=1.58.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary]>=3.2.0",
    "pwdlib[argon2]>=0.2.1",
    "pyjwt>=2.10.0",
    "pymupdf4llm>=0.0.17",
    "python-multipart>=0.0.18",
    "redis>=5.2.0",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
# Keep the web/API image free of PyTorch. The dedicated TTS worker selects one
# of these mutually exclusive variants at build time.
tts-cpu = [
    "qwen-tts>=0.1.1",
    "torch",
    "torchaudio",
]
tts-gpu = [
    "qwen-tts>=0.1.1",
    "torch",
    "torchaudio",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
conflicts = [
    [
        { extra = "tts-cpu" },
        { extra = "tts-gpu" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "tts-cpu" },
    { index = "pytorch-cu128", extra = "tts-gpu" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "tts-cpu" },
    { index = "pytorch-cu128", extra = "tts-gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
